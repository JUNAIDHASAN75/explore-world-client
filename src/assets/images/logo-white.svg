<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="textGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glowW" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group Logo Icon -->
  <g transform="translate(10, 5)">
    <!-- Globe Circle Outer Glow -->
    <circle cx="35" cy="35" r="32" fill="url(#primaryGradW)" opacity="0.25" />
    
    <!-- Globe Base Grid -->
    <circle cx="35" cy="35" r="28" fill="none" stroke="url(#primaryGradW)" stroke-width="2.5" />
    <ellipse cx="35" cy="35" rx="14" ry="28" fill="none" stroke="url(#primaryGradW)" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="35" cy="35" rx="28" ry="12" fill="none" stroke="url(#primaryGradW)" stroke-width="1.5" opacity="0.8" />
    <line x1="7" y1="35" x2="63" y2="35" stroke="url(#primaryGradW)" stroke-width="1.5" opacity="0.8" />

    <!-- Flight Trail Arc -->
    <path d="M 12 52 C 20 20, 50 15, 66 18" fill="none" stroke="url(#accentGradW)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" />

    <!-- Soaring Jet Icon -->
    <g transform="translate(56, 11) rotate(25) scale(0.85)">
      <path d="M 12 0 L 16 12 L 28 16 L 16 20 L 14 28 L 10 21 L 4 22 L 7 16 L 0 14 Z" fill="url(#accentGradW)" filter="url(#glowW)" />
    </g>

    <!-- Location Pin / Hotel Star Badge -->
    <g transform="translate(25, 20)">
      <path d="M 10 0 C 4.5 0 0 4.5 0 10 C 0 17 10 25 10 25 C 10 25 20 17 20 10 C 20 4.5 15.5 0 10 0 Z" fill="url(#primaryGradW)" />
      <!-- Star inside pin -->
      <polygon points="10,4 11.8,7.6 15.7,8.2 12.8,11 13.5,14.9 10,13 6.5,14.9 7.2,11 4.3,8.2 8.2,7.6" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography -->
  <!-- "EXPLORE" - Pure White (#ffffff) for Dark Mode / Dark Backgrounds -->
  <text x="92" y="42" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="26" letter-spacing="0.5" fill="#ffffff">
    EXPLORE
  </text>
  
  <!-- "WORLD" -->
  <text x="215" y="42" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="26" letter-spacing="0.5" fill="url(#textGradW)">
    WORLD
  </text>

  <!-- Tagline -->
  <text x="93" y="58" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" letter-spacing="2.5" fill="url(#accentGradW)">
    HOTELS &amp; TRAVEL BOOKING
  </text>
</svg>
